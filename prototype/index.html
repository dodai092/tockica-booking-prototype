<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Točkica: booking prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <img class="logo" src="assets/tockica-logo.svg" alt="Točkica na i">
</header>

<main>
  <section id="panel-raspored" class="panel" role="tabpanel" aria-label="Raspored">
    <h1 class="tab-title">Raspored</h1>
  <nav id="s-week" class="week" aria-label="Dani"></nav>
  <div class="account">
    <label>Demo račun
      <select id="s-account"></select>
    </label>
    <span id="s-balance" class="balance"></span>
  </div>
  <a id="s-mine-link" class="mine-link" href="#" hidden></a>
  <p id="s-message" class="message" role="status"></p>
  <section id="s-classes" class="classes" aria-label="Treninzi"></section>
  <section id="s-mine" class="classes" aria-label="Moje rezervacije"></section>
  <section id="s-bikes" class="bikes" hidden aria-label="Odabir bajka"></section>
  </section>

  <section id="panel-recepcija" class="panel" role="tabpanel" aria-label="Recepcija" hidden>
    <h1 class="tab-title">Recepcija</h1>
  <label class="field">Trening
    <select id="r-class"></select>
  </label>
  <section id="r-summary" class="summary" aria-label="Trening"></section>
  <button id="r-close" class="btn" hidden>Zatvori trening</button>
  <section id="r-bookings" class="roster" aria-label="Rezervacije"></section>
  <p id="r-message" class="message" role="status"></p>
  </section>

  <section id="panel-admin" class="panel" role="tabpanel" aria-label="Admin" hidden>
    <h1 class="tab-title">Admin</h1>
    <p id="a-message" class="message" role="status"></p>

    <h2 class="g-header">Računi</h2>
    <section id="a-accounts" aria-label="Računi"></section>

    <h2 class="g-header">Nadolazeće rezervacije</h2>
    <section id="a-bookings" class="group" aria-label="Rezervacije"></section>

    <h2 class="g-header">Paketi</h2>
    <section id="a-packs" aria-label="Paketi"></section>
    <p class="g-footer">Cijene se spremaju čim ih promijeniš. Prazna Multisport cijena znači da je nema.</p>

    <h2 class="g-header">Demo alati <span class="demo-tag">Samo prototip</span></h2>
    <section class="group" aria-label="Demo alati">
      <label class="g-row"><span class="g-main g-title">Trening</span><select id="a-demo-class" class="g-select"></select></label>
      <button id="a-fill" type="button" class="g-row g-action">Napuni trening (sve bajkove)</button>
      <button id="a-soon" type="button" class="g-row g-action">Dodaj trening za 20 min</button>
      <button id="a-reset" type="button" class="g-row g-action destructive">Resetiraj demo</button>
    </section>
    <p class="g-footer">Ovo ne postoji u pravoj aplikaciji.</p>
  </section>
</main>

<nav class="tab-bar" role="tablist" aria-label="Stranice">
    <button type="button" role="tab" id="tab-raspored" data-tab="raspored" aria-controls="panel-raspored" ><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span class="tab-label">Raspored</span><span class="tab-badge" id="badge-raspored" hidden></span></button>
    <button type="button" role="tab" id="tab-recepcija" data-tab="recepcija" aria-controls="panel-recepcija" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12l2 2 4-4"/><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6"/></svg><span class="tab-label">Recepcija</span></button>
    <button type="button" role="tab" id="tab-admin" data-tab="admin" aria-controls="panel-admin" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="tab-label">Admin</span></button>
</nav>

<script type="module" src="src/pages/app.js"></script>
</body>
</html>
